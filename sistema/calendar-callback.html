<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Conectando Calendar · InnovaPeople</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/sistema/_shared/tokens.css">
<style>
:root{
  /* GABARITO (CVO 31/07): os nomes que a tela ja usa apontam para o contrato (_shared/tokens.css).
     Claro por padrao, escuro por html[data-theme=dark] — sem depender de JS para clarear. */
  --marca:var(--ip-text);
  --marca-deep:var(--ip-text);
  --marca-light:var(--ip-line-strong);
  --marca-soft:var(--ip-surface-2);
  --acento:var(--ip-accent);
  --acento-deep:var(--ip-accent-strong);
  --acento-soft:var(--ip-accent-wash);
  --ink:var(--ip-text);
  --ink-soft:var(--ip-text-body);
  --muted:var(--ip-text-muted);
  --rule:var(--ip-line);
  --paper:var(--ip-surface);
  --paper-deep:var(--ip-surface-2);
  --success:var(--ip-ok);
  --warn:var(--ip-warn);
  --danger:var(--ip-danger);
  --info:var(--ip-info);
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 28px;-webkit-font-smoothing:antialiased}
.card{max-width:480px;width:100%;background:#fff;border:1px solid var(--rule);border-radius:18px;padding:48px 40px;text-align:center;box-shadow:0 24px 60px rgba(14,20,27,.10)}
.card svg.logo{width:60px;height:60px;margin:0 auto 22px;color:var(--marca)}
h1{font-family:var(--serif);font-weight:500;color:var(--marca-deep);font-size:26px;margin-bottom:12px;letter-spacing:-.01em}
.icon{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.icon svg{width:32px;height:32px}
.icon.success{background:#E2F0E8;color:var(--success)}
.icon.error{background:#FEEBEB;color:var(--danger)}
.icon.loading{background:var(--marca-soft);color:var(--marca)}
p{color:var(--ink-soft);margin-bottom:14px}
.spinner{display:inline-block;width:32px;height:32px;border:3px solid rgba(28,39,52,.2);border-top-color:var(--marca);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{display:inline-block;padding:13px 28px;border:none;border-radius:8px;background:var(--marca);color:#fff;font-family:var(--sans);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-decoration:none;margin-top:8px}
.btn:hover{background:var(--marca-deep);color:#fff}
.code{font-family:monospace;font-size:11px;color:var(--muted);background:var(--paper);padding:8px 12px;border-radius:6px;margin-top:12px;word-break:break-all}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="ip-logo" viewBox="0 0 120 120"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="56" r="44" stroke-width="0.5" opacity="0.15"/><circle cx="60" cy="56" r="34" stroke-width="0.6" opacity="0.25"/><ellipse cx="60" cy="56" rx="15" ry="20" stroke-width="2.2"/><line x1="60" y1="24" x2="60" y2="92" stroke-width="2.2"/><path d="M 32 102 Q 60 108 88 102" stroke-width="1.6" opacity="0.5"/></g></symbol></defs></svg>

<div class="card">
  <svg class="logo"><use href="#ip-logo"/></svg>

  <div id="state-loading">
    <div class="icon loading"><div class="spinner"></div></div>
    <h1>Conectando ao Google Calendar...</h1>
    <p style="font-family:var(--serif);font-style:italic">Um instante.</p>
  </div>

  <div id="state-success" style="display:none">
    <div class="icon success"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg></div>
    <h1>Conectado.</h1>
    <p>Seu Google Calendar agora está vinculado ao Sistema. A partir daqui, agendamentos criam evento real + link Google Meet.</p>
    <a href="/sistema/calendar.html" class="btn">Voltar ao Sistema</a>
  </div>

  <div id="state-error" style="display:none">
    <div class="icon error"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></div>
    <h1>Não foi possível conectar.</h1>
    <p id="error-msg">Houve um erro ao processar o retorno do Google.</p>
    <div class="code" id="error-code"></div>
    <a href="/sistema/calendar.html" class="btn" style="margin-top:18px">Tentar novamente</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<script>
const SUPA_URL='https://auth.innovasphere.ia.br';
const SUPA_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRxa255aGZycm1icXZrZHNoamZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5MzY3NjIsImV4cCI6MjA4NzUxMjc2Mn0.FQhTsVKAh_Abei65nJZsuXE7SbAxJ6yndFepeI_pZdA';
const sb=window.supabase.createClient(SUPA_URL,SUPA_ANON,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

function showState(id, msg, code) {
  document.querySelectorAll('[id^=state-]').forEach(e=>e.style.display='none');
  document.getElementById(id).style.display='block';
  if (msg) document.getElementById('error-msg').textContent = msg;
  if (code) document.getElementById('error-code').textContent = code;
}

async function processCallback() {
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  const state = params.get('state');
  const error = params.get('error');

  if (error) { showState('state-error', 'Google retornou erro: ' + error, ''); return; }
  if (!code || !state) { showState('state-error', 'Faltam parâmetros code/state na URL.', ''); return; }

  const { data:{session} } = await sb.auth.getSession();
  if (!session) { showState('state-error', 'Sessão expirou. Faça login novamente.', ''); return; }

  try {
    const r = await fetch(`${SUPA_URL}/functions/v1/innovapeople-calendar-oauth-callback`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${session.access_token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, state }),
    });
    const data = await r.json();
    if (!r.ok || !data.ok) {
      showState('state-error', data.erro || 'Erro desconhecido.', JSON.stringify(data).slice(0,200));
      return;
    }
    // Marca local
    const slug = state.split('.')[1];
    try { localStorage.setItem('ip_calendar_connected_'+slug, Date.now().toString()); } catch(_){}
    showState('state-success');
    // auto-redirect em 3s
    setTimeout(() => { location.href = '/sistema/calendar.html'; }, 3000);
  } catch(e) {
    showState('state-error', 'Erro de rede: '+ (e.message||e), '');
  }
}
processCallback();
</script>

</body>
</html>
